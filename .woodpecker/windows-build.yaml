# Counterpart of .github/workflows/windows-build.yml, with the same matrix:
#   push to main, pull request  debug, release, release-standalone
#   push to develop-*           debug
# No secrets: pull request pipelines run code from the pull request branch.

labels:
  os: windows
  env: native

matrix:
  include:
    - PRESET_SUFFIX: debug
      MAIN_ONLY: "false"
    - PRESET_SUFFIX: release
      MAIN_ONLY: "true"
    - PRESET_SUFFIX: release-standalone
      MAIN_ONLY: "true"

# Order on the agent: see README.md#order-on-the-agents.
depends_on:
  - name: commit-messages
    optional: true

when:
  - event: push
    branch: main
    status: [success, failure]
  # For pull requests, `branch` is the target branch.
  - event: pull_request
    branch: main
    status: [success, failure]
  - event: push
    branch: develop-**
    evaluate: '"${MAIN_ONLY}" == "false"'
    status: [success, failure]

steps:
  - name: build-msvc-${PRESET_SUFFIX}
    image: powershell
    commands:
      - .\.woodpecker\scripts\windows-build.ps1 -PresetSuffix ${PRESET_SUFFIX}
