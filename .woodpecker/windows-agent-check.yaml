# Smoke test of the Windows agent: shows that a pipeline reaches it and that every tool the
# other workflows need is installed. Limit it to `event: manual` once the agent is set up.
#
# All logic lives in .woodpecker/scripts: Woodpecker substitutes variables in this file (the raw
# text, comments included) before the shell sees it, which would break PowerShell variables.
# So no dollar sign appears in the workflow files except for intended matrix variables.

labels:
  os: windows
  env: native

when:
  - event: [push, manual]

steps:
  - name: agent-check
    image: powershell
    commands:
      - Write-Host "Hello from Windows"
      - hostname
      - git --version
      - .\.woodpecker\scripts\agent-check.ps1
