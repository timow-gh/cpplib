# Counterpart of .github/workflows/ubuntu-static-analysis.yml: the clang debug build, which runs
# clang-tidy on every target. Ninja -k 0 keeps building independent targets after failures, so
# clang-tidy reports as many compile and analysis issues as possible.

labels:
  os: linux
  env: linux

# Order on the agent: see README.md#order-on-the-agents.
depends_on:
  - name: linux-build
    optional: true
  - name: linux-package
    optional: true
  - name: linux-sanitizers
    optional: true
  - name: linux-coverage
    optional: true

when:
  - event: push
    branch: main
    status: [success, failure]
  # For pull requests, `branch` is the target branch.
  - event: pull_request
    branch: main
    status: [success, failure]

steps:
  - name: clang-tidy
    image: bash
    commands:
      - bash .woodpecker/scripts/linux-build.sh clang-debug -k 0
