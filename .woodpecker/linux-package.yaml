# Packaging check for pull requests, which GitHub does not have: builds the shared and standalone
# Linux packages the way release-linux.yaml does and checks them, so a packaging mistake shows up
# in the pull request instead of at the next release. Nothing is installed on the agent; see
# linux-verify.sh.

labels:
  os: linux
  env: linux

matrix:
  DELIVERY_MODE:
    - shared
    - standalone

when:
  # For pull requests, `branch` is the target branch.
  - event: pull_request
    branch: main

steps:
  - name: package-${DELIVERY_MODE}
    image: bash
    commands:
      - bash .woodpecker/scripts/linux-package.sh ${DELIVERY_MODE}

  - name: verify-${DELIVERY_MODE}
    image: bash
    commands:
      - bash .woodpecker/scripts/linux-verify.sh ${DELIVERY_MODE}
