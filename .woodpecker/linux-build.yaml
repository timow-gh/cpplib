# Counterpart of .github/workflows/ubuntu-build.yml, with the same matrix:
#   push to main, pull request  gcc/clang x debug/release, gcc release-standalone
#   push to develop-*           gcc-debug
# No secrets: pull request pipelines run code from the pull request branch.

labels:
  os: linux
  env: linux

matrix:
  include:
    - PRESET_SUFFIX: gcc-debug
      MAIN_ONLY: "false"
    - PRESET_SUFFIX: gcc-release
      MAIN_ONLY: "true"
    - PRESET_SUFFIX: clang-debug
      MAIN_ONLY: "true"
    - PRESET_SUFFIX: clang-release
      MAIN_ONLY: "true"
    # The standalone delivery mode only in a release build, as on GitHub.
    - PRESET_SUFFIX: gcc-release-standalone
      MAIN_ONLY: "true"

when:
  - event: push
    branch: main
  # For pull requests, `branch` is the target branch.
  - event: pull_request
    branch: main
  - event: push
    branch: develop-**
    evaluate: '"${MAIN_ONLY}" == "false"'

steps:
  - name: build-${PRESET_SUFFIX}
    image: bash
    commands:
      - bash .woodpecker/scripts/linux-build.sh ${PRESET_SUFFIX}
