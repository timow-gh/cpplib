# Counterpart of .github/workflows/ubuntu-sanitizers.yml: clang debug builds with ASan, TSan and
# UBSan.

labels:
  os: linux
  env: linux

matrix:
  SANITIZER:
    - asan
    - tsan
    - ubsan

# Order on the agent: see README.md#order-on-the-agents.
depends_on:
  - name: linux-build
    optional: true
  - name: linux-package
    optional: true

when:
  - event: push
    branch: main
    status: [success, failure]
  # For pull requests, `branch` is the target branch.
  - event: pull_request
    branch: main
    status: [success, failure]

steps:
  - name: sanitizer-clang-debug-${SANITIZER}
    image: bash
    commands:
      - bash .woodpecker/scripts/linux-build.sh clang-debug-${SANITIZER}
