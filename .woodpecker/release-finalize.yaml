# Publishes the release of a v* tag once release.yaml (Windows) and release-linux.yaml have both
# built, verified and uploaded their packages into the draft release: the guarantee of
# .github/workflows/release.yml that a broken package never gets published. Woodpecker skips this
# workflow if one of the two fails, so the release stays a draft.
#
# A leftover draft: fix the cause and restart the pipeline (uploads replace assets of the same
# name), or delete the draft in the Forgejo UI if it should not become a release.

labels:
  os: windows
  env: native

depends_on:
  - release
  - release-linux

when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: finalize
    image: powershell
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - .\.woodpecker\scripts\release-finalize.ps1
