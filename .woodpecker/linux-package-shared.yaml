# Packaging check for pull requests, which GitHub does not have: builds the shared Linux package
# the way release-linux.yaml does and checks it, so a packaging mistake shows up in the pull
# request instead of at the next release. Nothing is installed on the agent; see linux-verify.sh.
#
# One workflow per job instead of a matrix, so the commit status is named after the job
# (ci/woodpecker/pr/linux-package-shared); a matrix entry would only get a number.

labels:
  os: linux
  env: linux

when:
  # For pull requests, `branch` is the target branch.
  - event: pull_request
    branch: main

steps:
  - name: package-shared
    image: bash
    commands:
      - bash .woodpecker/scripts/linux-package.sh shared

  - name: verify-shared
    image: bash
    commands:
      - bash .woodpecker/scripts/linux-verify.sh shared
