name: Create Release

# Trigger the workflow only when a tag starting with 'v' is pushed
# Example: v1.0.0, v2.3.1-beta, etc.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate_version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          cmake_version="$(
            awk '
              /^[[:space:]]*project[[:space:]]*\([[:space:]]*cpplib/ { in_project = 1 }
              in_project && /VERSION/ {
                for (i = 1; i <= NF; i++) {
                  if ($i == "VERSION") {
                    print $(i + 1)
                    exit
                  }
                }
              }
              in_project && /\)/ { in_project = 0 }
            ' CMakeLists.txt
          )"
          manifest_version="$(jq -r '.version' vcpkg.json)"

          if [[ -z "$cmake_version" ]]; then
            echo "Could not read the CMake project version from CMakeLists.txt" >&2
            exit 1
          fi
          if [[ "$manifest_version" != "$cmake_version" ]]; then
            echo "vcpkg.json version $manifest_version does not match CMake version $cmake_version" >&2
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$cmake_version" ]]; then
              echo "Tag version $tag_version does not match CMake version $cmake_version" >&2
              exit 1
            fi
          fi

          echo "version=$cmake_version" >> "$GITHUB_OUTPUT"

  build-packages:
    needs: validate_version
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        # shared: app + cpplib DLL/.so + SDK; standalone: the self-contained app only
        delivery-mode: [shared, standalone]
        include:
          - os: ubuntu-24.04
            workflow-prefix: workflow-package-gcc
            artifact-path: out/packages/package-gcc-release
          - os: windows-latest
            workflow-prefix: workflow-package-msvc
            artifact-path: out/packages/package-msvc-release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set VCPKG_ROOT (Linux)
        if: runner.os == 'Linux'
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
        shell: bash

      - name: Set VCPKG_ROOT (Windows)
        if: runner.os == 'Windows'
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install WiX (Windows only)
        # CPack's WIX generator drives WiX v3 (candle/light). windows-latest ships
        # WiX v3, but install it explicitly for reproducibility.
        if: matrix.os == 'windows-latest'
        run: choco install wixtoolset -y

      - name: Create ${{ matrix.delivery-mode }} package
        run: |
          cmake --workflow --preset ${{ matrix.workflow-prefix }}-${{ matrix.delivery-mode }}
        shell: bash

      - name: Upload ${{ matrix.os }} ${{ matrix.delivery-mode }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.delivery-mode }}-build
          path: ${{ github.workspace }}/${{ matrix.artifact-path }}-${{ matrix.delivery-mode }}/*.*
          retention-days: 1

  # Install and run the produced packages the way a user would, on a machine that
  # never saw the build. A broken package never gets published.
  verify-packages:
    needs: build-packages
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        delivery-mode: [shared, standalone]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.delivery-mode }}-build
          path: packages

      - name: Install the DEB packages in a clean Ubuntu container and run the app
        if: runner.os == 'Linux'
        run: |
          # Only the application packages: the dev package is checked below.
          debs=$(ls packages/*.deb | grep -v -- '-dev_' | sed 's|^packages/|/packages/|' | tr '\n' ' ')
          docker run --rm -v "$PWD/packages:/packages:ro" ubuntu:24.04 bash -euxc "
            apt-get update
            apt-get install -y --no-install-recommends $debs
            cpplib_app"
        shell: bash

      - name: Run the app from the TGZ archive
        if: runner.os == 'Linux'
        run: |
          mkdir archive
          tar xzf packages/*.tar.gz -C archive --strip-components=1
          ./archive/bin/cpplib_app
        shell: bash

      - name: Build against the installed SDK DEB (shared only)
        if: runner.os == 'Linux' && matrix.delivery-mode == 'shared'
        run: |
          sudo apt-get install -y ./packages/libcpplib0_*.deb ./packages/libcpplib-dev_*.deb
          # No vcpkg and no CMAKE_PREFIX_PATH: find_package(cpplib) uses /usr.
          cmake -S test/test_install/cpplib_install_test_template -B consumer-build -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer-build
          ./consumer-build/use_installdir
        shell: bash

      - name: Install the MSI silently and run the app
        if: runner.os == 'Windows'
        run: |
          $msi = (Get-ChildItem packages\*.msi).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'cpplib-msi'
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$msi`"", '/qn', 'ALLUSERS=1', "APPLICATIONFOLDER=`"$dir`"", '/l*v', 'msi.log')
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 50; exit $p.ExitCode }
          & "$dir\bin\cpplib_app.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Run the app from the ZIP archive
        if: runner.os == 'Windows'
        run: |
          Expand-Archive (Get-ChildItem packages\*.zip).FullName -DestinationPath archive
          $bin = (Get-ChildItem archive -Directory)[0].FullName + '\bin'
          Get-ChildItem $bin
          if ('${{ matrix.delivery-mode }}' -eq 'shared' -and -not (Test-Path "$bin\vcruntime140.dll")) {
            Write-Error 'The shared package must ship the app-local MSVC runtime'; exit 1
          }
          & "$bin\cpplib_app.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

  create-release:
    if: github.event_name == 'push'
    needs:
      - validate_version
      - build-packages
      - verify-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: git_cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.validate_version.outputs.version }}
          draft: false
          prerelease: false
          body: ${{ steps.git_cliff.outputs.content }}
          files: |
            ubuntu-24.04-shared-build/*
            ubuntu-24.04-standalone-build/*
            windows-latest-shared-build/*
            windows-latest-standalone-build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
