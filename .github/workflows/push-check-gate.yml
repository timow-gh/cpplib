name: Push Check Gate

on:
  workflow_call:
    outputs:
      should_run:
        description: Whether push checks should run for this event.
        value: ${{ jobs.push-check-gate.outputs.should_run }}

jobs:
  push-check-gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Check for open PR on pushed branch
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('should_run', 'true');
              return;
            }

            if (!context.ref.startsWith('refs/heads/')) {
              core.setOutput('should_run', 'true');
              return;
            }

            const branch = context.ref.slice('refs/heads/'.length);
            const defaultBranch = context.payload.repository?.default_branch;

            if (branch === defaultBranch) {
              core.setOutput('should_run', 'true');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 1,
            });

            const shouldRun = pulls.length === 0;
            if (shouldRun) {
              core.info(`No open PR found for ${branch}; running push checks.`);
            } else {
              core.info(`Open PR found for ${branch}; skipping push checks.`);
            }
            core.setOutput('should_run', String(shouldRun));
